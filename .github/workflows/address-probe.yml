name: Address data probe (temporary)

# 주소 자료를 어디서 받을 수 있는지 확인용 (임시, 확인 후 삭제)
on:
  push:
    branches: [main-yievoq]
    paths: ['.github/workflows/address-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: juso.go.kr reachable from runner?
        run: |
          for u in https://business.juso.go.kr/ \
                   "https://business.juso.go.kr/addrlink/attrbDBDwld/attrbDBDwldList.do?cPath=99MD" \
                   "https://business.juso.go.kr/addrlink/elctrnMapProvd/geoDBDwldList.do" ; do
            echo "=== $u"
            curl -sS -m 30 -L -A "Mozilla/5.0" -o page.html -w '%{http_code} %{size_download}\n' "$u" || true
            iconv -f cp949 -t utf-8 page.html 2>/dev/null > p.txt || cp page.html p.txt
            grep -oiE '(fileDown|download|Dwld|위치정보|내비게이션|건물DB|전체분|regYmd|ctprvn)[^"<]{0,160}' p.txt | sort -u | head -60 || true
          done
      - name: OpenStreetMap address coverage
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          curl -sfL -o kr.osm.pbf https://download.geofabrik.de/asia/south-korea-latest.osm.pbf
          osmium tags-filter -O -o addr.osm.pbf kr.osm.pbf nwr/addr:housenumber
          osmium fileinfo -e addr.osm.pbf | grep -E 'Number of (nodes|ways|relations)'
          osmium tags-filter -O -o street.osm.pbf addr.osm.pbf nwr/addr:street
          osmium fileinfo -e street.osm.pbf | grep -E 'Number of (nodes|ways|relations)'
          osmium export -f geojsonseq street.osm.pbf 2>/dev/null | grep -oE '"addr:[a-z_:]+":"[^"]*"' | head -40
          osmium tags-filter -O -o busan.osm.pbf street.osm.pbf 'nwr/addr:city=*부산*' 'nwr/addr:province=*부산*' || true
          osmium tags-filter -O -o named.osm.pbf kr.osm.pbf n/name w/building=* || true
