name: Probe safetydata (temporary)

# 재난안전데이터공유플랫폼 자료 8개가 어떻게 생겼는지 몇 줄씩만 받아 봄 (임시, 확인 뒤 지움)
on:
  push:
    branches: [main-yievoq]
    paths: ['.github/workflows/safetydata-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe
        env:
          K_QUAKE: ${{ secrets.SD_KEY_QUAKE }}
          K_TSUNAMI: ${{ secrets.SD_KEY_TSUNAMI }}
          K_CHEMICAL: ${{ secrets.SD_KEY_CHEMICAL }}
          K_COLD: ${{ secrets.SD_KEY_COLD }}
          K_HEAT: ${{ secrets.SD_KEY_HEAT }}
          K_QUAKE_HOUSING: ${{ secrets.SD_KEY_QUAKE_HOUSING }}
          K_HOUSING: ${{ secrets.SD_KEY_HOUSING }}
          K_WATER: ${{ secrets.SD_KEY_WATER }}
        run: |
          probe() {
            name=$1; id=$2; key=$3
            echo "=================== $name ($id) key length ${#key}"
            curl -sS -m 60 "https://www.safetydata.go.kr/V2/api/$id?serviceKey=$key&returnType=json&pageNo=1&numOfRows=2" -o out.txt -w 'HTTP %{http_code}\n' || true
            head -c 3000 out.txt; echo
          }
          probe2() {
            name=$1; id=$2; key=$3
            for q in "returnType=json&pageNo=1&numOfRows=2" "pageNo=1&numOfRows=2" "returnType=json"; do
              echo "=================== $name ($id) $q"
              rm -f out.txt
              curl -sS -m 180 "https://www.safetydata.go.kr/V2/api/$id?serviceKey=$key&$q" -o out.txt -w 'HTTP %{http_code} %{time_total}s\n' || true
              [ -f out.txt ] && head -c 2500 out.txt; echo
            done
          }
          probe2 quake_housing DSSP-IF-20661 "$K_QUAKE_HOUSING"
          probe2 housing DSSP-IF-10945 "$K_HOUSING"
          # 무더위쉼터 뒤쪽 쪽: 1000줄씩 받을 때 겹치는지
          for pg in 1 63; do
            curl -sS -m 120 "https://www.safetydata.go.kr/V2/api/DSSP-IF-10942?serviceKey=$K_HEAT&returnType=json&pageNo=$pg&numOfRows=1000" -o h$pg.txt || true
            python3 -c "import json,sys;d=json.load(open('h$pg.txt'));b=d['body'];print('heat page',$pg,len(b),d['totalCount'],b[0]['RSTR_FCLTY_NO'] if b else None)" || head -c 500 h$pg.txt
          done
