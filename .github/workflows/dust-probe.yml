name: Dust shelter API probe (temporary)

# 에어코리아 미세먼지 쉼터: 428만 건이 반복인지 확인 (앞 80쪽에서 서로 다른 쉼터 수가 언제 멈추는지) (임시)
on:
  push:
    branches: [main-yievoq]
    paths: ['.github/workflows/dust-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Count distinct shelters page by page
        env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          key = os.environ['KEY']
          seen, first = set(), None
          for p in range(1, 81):
              u = f'https://apis.data.go.kr/B552584/ptcShuntPlaceService/getList?serviceKey={key}&returnType=json&pageNo={p}&numOfRows=1000'
              items = json.load(urllib.request.urlopen(u, timeout=90))['body']['items']
              ids = [(i.get('shltrNm'), round(i.get('lat') or 0, 5), round(i.get('lot') or 0, 5)) for i in items]
              if first is None: first = ids
              new = sum(1 for x in ids if x not in seen)
              seen.update(ids)
              same_as_first = ids == first and p > 1
              if p <= 5 or p % 5 == 0 or same_as_first or new == 0:
                  print(f'page {p}: new {new}, distinct so far {len(seen)}{"  SAME AS PAGE 1" if same_as_first else ""}', flush=True)
          from collections import Counter
          print('by province', Counter(x for x in []) )
          PY
