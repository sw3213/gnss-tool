name: Build hillshade package

# 산 그림자(입체감)용 고도 타일(kr-hillshade.pmtiles, raster-dem Terrarium PNG)을
# Copernicus DEM 30 m에서 만들어 Release "maps"에 올림. 앱은 kind="hillshade"를 지도에 음영으로 그림.
# DEM: Copernicus GLO-30 © DLR e.V. 2010-2014, © Airbus Defence and Space GmbH 2014-2018,
#      provided under COPERNICUS by the European Union and ESA

on:
  workflow_dispatch:
    inputs:
      maxzoom:
        description: '최대 확대 단계 (11 ≈ 60 m 해상도)'
        default: '11'

permissions:
  contents: write

jobs:
  hillshade:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL (Python) and pmtiles
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gdal-bin python3-gdal python3-numpy python3-pil jq
          curl -sfL -o pmtiles.tar.gz \
            https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          tar xzf pmtiles.tar.gz pmtiles

      - name: Download Copernicus DEM tiles (Korea)
        run: |
          mkdir -p dem
          for lat in 33 34 35 36 37 38; do
            for lon in 124 125 126 127 128 129 130 131; do
              n="Copernicus_DSM_COG_10_N${lat}_00_E${lon}_00_DEM"
              curl -sf -o "dem/$n.tif" "https://copernicus-dem-30m.s3.amazonaws.com/$n/$n.tif" || rm -f "dem/$n.tif"
            done
          done
          gdalbuildvrt -q dem.vrt dem/*.tif

      - name: Render terrain tiles
        run: |
          python3 maps/build_hillshade.py dem.vrt hillshade.mbtiles 5 "${{ inputs.maxzoom || '11' }}" 124.5 33.0 132.0 38.7
          ./pmtiles convert hillshade.mbtiles kr-hillshade.pmtiles
          ./pmtiles show kr-hillshade.pmtiles | head -20
          ls -la kr-hillshade.pmtiles

      - name: Publish to release "maps"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          size=$(stat -c %s kr-hillshade.pmtiles)
          date=$(date -u +%Y-%m-%d)
          gh release download maps -p catalog.json -O old.json 2>/dev/null || echo '[]' > old.json
          jq --arg url "https://github.com/$REPO/releases/download/maps/kr-hillshade.pmtiles" \
             --arg date "$date" --argjson size "$size" \
             '[.[] | select(.kind != "hillshade")] + [{
                id: "kr-hillshade", name: "대한민국 지형 음영 (입체)", kind: "hillshade",
                bbox: [124.5, 33.0, 132.0, 38.7], url: $url, date: $date, size: $size, maxzoom: 11
              }]' old.json > catalog.json
          cat catalog.json
          gh release upload maps kr-hillshade.pmtiles catalog.json --clobber
