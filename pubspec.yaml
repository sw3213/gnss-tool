name: gnss_tool
description: Offline GNSS and terrain tool (stage 1 - NMEA simulator and skyplot)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <5.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  maplibre_gl: ^0.27.1
  ota_update: ^7.1.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # 지도 라벨용 라틴/숫자 글리프 (한글은 폰 글꼴 사용). 출처: protomaps/basemaps-assets
    - assets/map/fonts/NotoSansRegular/
    - assets/map/fonts/NotoSansMedium/
