name: Shelter API probe (temporary)

# 민방위대피시설 조회서비스의 요청 주소·결과 모양 확인용 (임시, 확인 후 삭제). 인증키는 Secret에서, 로그에는 가려짐
on:
  push:
    branches: [main-yievoq]
    paths: ['.github/workflows/shelter-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Try request addresses
        env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "DATA_GO_KR_KEY 없음"; else echo "키 길이 ${#KEY}"; fi
          base=https://apis.data.go.kr/1741000/civil_defense_shelter_info
          for op in "" /info /getInfo /list /getList /civil_defense_shelter_info /getCivilDefenseShelterInfo; do
            for rt in json; do
              echo "=================== $op"
              curl -sS -m 30 -G "$base$op" --data-urlencode "serviceKey=$KEY" \
                -d pageNo=1 -d numOfRows=2 -d returnType=$rt -d type=$rt -o r.txt -w 'HTTP %{http_code} %{size_download}\n' || true
              head -c 1500 r.txt; echo
            done
          done
