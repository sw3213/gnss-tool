name: Address data probe (temporary)

# 정부 도로명주소 자료를 자동으로 받을 수 있는지 확인용 (임시, 확인 후 삭제)
on:
  push:
    branches: [main-yievoq]
    paths: ['.github/workflows/address-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Crawl juso.go.kr download pages
        run: |
          get() { curl -sS -m 30 -L -A "Mozilla/5.0" -c jar -b jar -o page.html -w "%{http_code} %{size_download} %{url_effective}\n" "$1" || true; }
          for u in https://business.juso.go.kr/ https://www.juso.go.kr/ \
                   https://business.juso.go.kr/addrlink/main.do \
                   https://business.juso.go.kr/addrlink/adresInfoProvd/guidance/provdAdresInfo.do \
                   "https://business.juso.go.kr/addrlink/attrbDBDwld/attrbDBDwldList.do?cPath=99MD" \
                   https://business.juso.go.kr/addrlink/elctrnMapProvd/geoDBDwldList.do ; do
            echo "=================== $u"
            get "$u"
            (iconv -f cp949 -t utf-8 page.html 2>/dev/null || cat page.html) > p.txt
            head -c 600 p.txt; echo
            grep -oE 'href="[^"]*"' p.txt | grep -iE 'dwld|dwnld|down|provd|adresInfo|DB' | sort -u | head -60
            grep -oE "(fn[A-Za-z]*Down[A-Za-z]*|fileDown|download)\([^)]{0,200}\)" p.txt | sort -u | head -30
            grep -oE '(위치정보요약|내비게이션|건물DB|전자지도|주소DB)[^<]{0,80}' p.txt | sort -u | head -30
          done
