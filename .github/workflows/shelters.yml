name: Build civil defense shelters

# 민방위 대피소(kr-shelters.json)를 행정안전부 민방위대피시설 조회서비스에서 받아 Release "maps"에 올림.
# 인증키: Secret DATA_GO_KR_KEY (공공데이터포털). 앱은 kind="shelters"로 지도·가까운 대피소에 씀.
# 만드는 코드는 maps/build_shelters.py, 앱 쪽은 lib/shelters.dart

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['maps/build_shelters.py', '.github/workflows/shelters.yml']
  schedule:
    - cron: '0 8 1 * *' # 매월 1일

permissions:
  contents: write

jobs:
  shelters:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download shelters
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 maps/build_shelters.py kr-shelters.json

      - name: Publish to release "maps"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          size=$(stat -c %s kr-shelters.json)
          date=$(date -u +%Y-%m-%d)
          gh release download maps -p catalog.json -O old.json 2>/dev/null || echo '[]' > old.json
          jq --arg url "https://github.com/$REPO/releases/download/maps/kr-shelters.json" \
             --arg date "$date" --argjson size "$size" \
             '[.[] | select(.kind != "shelters")] + [{
                id: "kr-shelters", name: "대한민국 민방위 대피소", kind: "shelters",
                bbox: [124.5, 33.0, 132.0, 38.7], url: $url, date: $date, size: $size, maxzoom: 0
              }]' old.json > catalog.json
          cat catalog.json
          gh release upload maps kr-shelters.json catalog.json --clobber
